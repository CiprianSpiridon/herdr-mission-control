        if(!matching.length)spaces.append(e('div','No matching spaces','mc-small'));
        app.root.querySelectorAll('[data-order]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.order===state.order)));
        app.root.querySelectorAll('[data-scope]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scope===state.scope)));
        app.root.querySelectorAll('[data-source]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.source===state.source)));
        const statusOrder=['Needs input','Done','Working','Idle'];
        const sorted=[...state.agents].sort((a,b)=>state.order==='spaces'?a.repoId.localeCompare(b.repoId):statusOrder.indexOf(a.status)-statusOrder.indexOf(b.status));
        const agentList=app.q('agents');
        agentList.replaceChildren();
        let previousRepo='';
        for(const agent of sorted.slice(0,app.agentLimit)) {
          const target=repos.find(r=>r.id===agent.repoId);
          if(state.order==='spaces'&&previousRepo!==target.id){agentList.append(e('div',target.name,'mc-machine'));previousRepo=target.id;}
          const card=e('div','','mc-agent');
          const title=e('div','','mc-agent-name');
          const focus=btn(agent.title,()=>{state.repoId=agent.repoId;app.focusedAgent=agent.id;app.mode='classic';app.terminal='agent';refresh();save();notify(app,'Focused '+agent.title+' in '+target.name);});
          focus.setAttribute('aria-label','Focus '+agent.title+' using '+agent.tool);
          title.append(toolIcon(agent.tool),focus);
          card.append(title,e('small',agent.key+' · '+target.name),e('div',agent.status,'mc-agent-state mc-small'+(agent.status==='Needs input'?' mc-attention':'')));
          meter(card,'Context',agent.context);
          const quota=agent.tool==='Codex'?42:agent.tool==='Claude Code'?8:null;
          meter(card,'Quota · Work',quota,'mc-quota');
          agentList.append(card);
        }
        if(sorted.length>app.agentLimit)agentList.append(btn('Show more agents',()=>{app.agentLimit+=4;render(app);},'mc-small'));
        const trackers=app.q('trackers');
        trackers.replaceChildren();
        trackers.hidden=state.source==='sessions';
        app.q('history').parentElement.hidden=state.source!=='sessions';
        if(state.source!=='sessions')trackers.append(issuePanel(app,state.source));
        historyRows(app,app.q('history'),repo);
        const side=app.q('side-content');
        side.replaceChildren();
        const scopeButton=btn(state.scope==='space'?'This space ▾':'All spaces ▾',()=>{state.scope=state.scope==='space'?'all':'space';refresh();save();},'mc-small');
        side.append(scopeButton);
        if(state.source==='sessions'){const panel=e('div','','mc-panel');historyRows(app,panel,repo);side.append(panel);}else side.append(issuePanel(app,state.source));
        const tabs=app.q('terminal-tabs');
        tabs.replaceChildren();
        for(const [label,type]of [[activeAgent?.title||'Agent','agent'],['Terminal','shell']]) {
          const b=btn(label,()=>{app.terminal=type;render(app);});
          if(type==='agent'&&activeAgent)b.prepend(toolIcon(activeAgent.tool));
          b.setAttribute('aria-pressed',String(app.terminal===type));
          tabs.append(b);
        }
        const plus=btn('+',()=>openAgentMenu(app));
        plus.setAttribute('aria-label','Open agent menu');
        tabs.append(plus);
        const spacer=e('span');spacer.style.flex='1';tabs.append(spacer);
        tabs.append(btn(app.panelOpen?'Hide panel':'Work panel',()=>{app.panelOpen=!app.panelOpen;render(app);},'mc-panel-toggle'));
        const utility=btn('',()=>openUtilities(app),'mc-icon-button mc-more');utility.append(e('span','','mc-ellipsis'));utility.setAttribute('aria-label','Workspace tools');tabs.append(utility);
        const terminal=app.q('console');
        terminal.replaceChildren();
        if(app.terminal==='shell')terminal.append(e('p',repo.name+' · '+repo.machine,'mc-small'),e('p','❯ '+repo.folder,'mc-prompt'),e('p','▌','mc-prompt'));
        else terminal.append(e('p',(activeAgent?.tool||'Agent')+' · '+repo.name+' · example session','mc-small'),e('p','› '+(activeAgent?.title||'Work in this repository'),'mc-prompt'),e('p','Inspecting the repository and its contributor instructions.'),e('p','Reviewing the relevant code and the linked issue.'),e('p','› Add a follow-up instruction…','mc-prompt'));
        app.q('footer').textContent=machines.length+' machines · '+repos.length+' spaces · '+state.agents.length+' agents · Design preview';
      }
      for(const app of apps){for(const tab of app.root.querySelectorAll('[data-source]'))tab.prepend(icon({jira:'jira',github:'github',prs:'pull-request',sessions:'history'}[tab.dataset.source]));app.root.querySelector('[data-setting-icon]').append(icon('settings'));app.q('space-search').addEventListener('input',()=>{app.limit=6;render(app);});app.root.querySelectorAll('[data-order]').forEach(b=>b.addEventListener('click',()=>{state.order=b.dataset.order;refresh();save();}));app.root.querySelectorAll('[data-scope]').forEach(b=>b.addEventListener('click',()=>{state.scope=b.dataset.scope;refresh();save();}));app.root.querySelectorAll('[data-source]').forEach(b=>b.addEventListener('click',()=>{state.source=b.dataset.source;refresh();save();}));for(const b of app.root.querySelectorAll('[data-action]'))b.addEventListener('click',()=>{const action=b.dataset.action;if(action==='swap'){app.mode=app.mode==='mission'?'classic':'mission';render(app);}if(action==='new-agent')openAgentMenu(app);if(action==='sessions')openHistory(app,current());if(action==='reopen')openReopen(app);if(action==='accounts')openAccounts(app);if(action==='settings')openSettings(app,'look');if(action==='add-machine')openSettings(app,'machines');if(action==='close-dialog')close(app);});app.root.addEventListener('keydown',event=>{if(event.key==='Escape')close(app);});}
      window.addEventListener('openai:set_globals',event=>{const s=event.detail?.globals?.widgetState?.privateContent;if(!s)return;if(repos.some(r=>r.id===s.repoId))state.repoId=s.repoId;if(['space','all'].includes(s.scope))state.scope=s.scope;if(['priority','spaces'].includes(s.order))state.order=s.order;if(['jira','github','prs','sessions'].includes(s.source))state.source=s.source;if(Array.isArray(s.pinned))state.pinned=s.pinned.filter(t=>t===''||tools.includes(t)).slice(0,3);if(s.repoDefaults&&typeof s.repoDefaults==='object')state.repoDefaults=s.repoDefaults;refresh();});
      refresh();
    })();
  </script>
</div>
